name: 反馈一个 Bug
description: 运行结果和预期不一致时用这个模板
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请尽量给出能复现的信息，截图可以直接拖进来。
        如果只是"某段代码编译不过"，把那段代码贴出来最快。

  - type: input
    id: browser
    attributes:
      label: 浏览器和版本
      description: 例如 Edge 130、Chrome 131
      placeholder: Edge 130
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 打开方式
      options:
        - 在线页面（GitHub Pages）
        - 本地双击 index.html
        - 连接电脑上的文件夹（磁盘工程）
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: 出问题的位置
      description: 例程编号 / 页面 / 具体操作
      placeholder: 例程 07 LCD1602，或者"新建文件后点编译"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际的结果
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 编译输出 / 控制台报错（可选）
      render: text
