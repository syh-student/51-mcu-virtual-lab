name: 提一个建议
description: 新功能、新例程、体验改进都可以提
title: "[建议] "
body:
  - type: textarea
    id: need
    attributes:
      label: 你想解决的问题
      description: 说说现在哪里别扭，比直接给方案更有用
      placeholder: 例如"引脚板不支持 LCD，切过去之后不知道该干什么"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望的解法（可选）

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options:
        - C51 解释器 / 编译
        - 虚拟开发板 / 引脚板
        - 时序图
        - 硬件实验室
        - 工程与文件管理
        - 界面 / 交互
        - 文档与示例
        - 其他

  - type: textarea
    id: more
    attributes:
      label: 补充信息（可选）
      description: 参考截图、同类工具的做法、你愿意自己提交 PR 吗
