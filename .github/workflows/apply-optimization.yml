name: Apply optimization (one-shot)

# 一次性发布工作流：把本地优化补丁应用到 main，构建产物后推送。
# 成功跑完后本文件会在同一次提交里被删除。

on:
  push:
    paths:
      - '.github/workflows/apply-optimization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-optimization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 统一行尾为 LF
        run: |
          python - <<'PY'
          import pathlib, subprocess
          tracked = subprocess.check_output(['git', 'ls-files']).decode('utf-8').splitlines()
          skip = ('.png', '.jpg', '.jpeg', '.gif', '.ico', '.woff', '.woff2', '.zip')
          changed = 0
          for name in tracked:
              path = pathlib.Path(name)
              if not path.is_file() or name.endswith(skip):
                  continue
              data = path.read_bytes()
              if b'\r\n' in data:
                  path.write_bytes(data.replace(b'\r\n', b'\n'))
                  changed += 1
          print('normalized files:', changed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no eol changes'; else git commit -m 'chore: 统一行尾为 LF'; fi

      - name: 下载补丁与截图
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opt.patch" 'https://aka.doubaocdn.com/s/V7ekVVb6jS'
          base='https://aka.doubaocdn.com/s'
          curl -fsSL --retry 3 -o docs/screenshots/code.png "$base/98fREXcDJN"
          curl -fsSL --retry 3 -o docs/screenshots/board.png "$base/nKHYpbKfHG"
          curl -fsSL --retry 3 -o docs/screenshots/pins.png "$base/lXgzA9WmrA"
          curl -fsSL --retry 3 -o docs/screenshots/scope.png "$base/3qMvpCgvs1"
          curl -fsSL --retry 3 -o docs/screenshots/hardware.png "$base/i3WA6Wubtc"
          curl -fsSL --retry 3 -o docs/screenshots/mobile.png "$base/fVlVigkOIN"
          ls -l "$RUNNER_TEMP/opt.patch" docs/screenshots

      - name: 应用补丁
        run: |
          set -euo pipefail
          git -c core.autocrlf=false apply -p2 --index "$RUNNER_TEMP/opt.patch"
          rm -f .github/workflows/apply-optimization.yml
          git rm -q --ignore-unmatch docs/_binprobe2.png || true

      - name: 安装依赖与构建
        run: |
          set -euo pipefail
          npm ci
          python build.py
          test -s index.html
          test -s hardware.html
          ! grep -q '__STYLE__\|__VM__\|__APP__' index.html

      - name: 静态检查与测试
        run: |
          npm run lint
          npm test

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name 'syh-student'
          git config user.email '2137438918@qq.com'
          git add -A
          git commit -m '优化：工程树多级文件夹、README 重写、CI 与工程化配置'
          git push origin HEAD:main
