name: style-tidy

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载补丁并应用
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$RUNNER_TEMP/opt.patch" https://aka.doubaocdn.com/s/gRE6pyOzit
          git apply --whitespace=nowarn "$RUNNER_TEMP/opt.patch"
          git status --short
      - name: 提交并推送
        run: |
          git config user.name "syh-student"
          git config user.email "2137438918@qq.com"
          git rm -r --ignore-unmatch .github/trigger
          git rm --ignore-unmatch .github/workflows/style-tidy.yml
          git add -A
          git commit -m "fix: 页面导航改网络优先，避免旧缓存停在旧版页面"
          git push origin HEAD:main
