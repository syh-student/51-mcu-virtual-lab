name: Visual refresh (one-shot)

on:
  push:
    paths:
      - '.github/workflows/visual-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-refresh
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载补丁与新截图
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opt.patch" 'https://aka.doubaocdn.com/s/6YYAUy884D'
          base='https://aka.doubaocdn.com/s'
          curl -fsSL --retry 3 -o docs/screenshots/code.png "$base/EDhhegbfqz"
          curl -fsSL --retry 3 -o docs/screenshots/board.png "$base/SUDuwDf7F9"
          curl -fsSL --retry 3 -o docs/screenshots/pins.png "$base/BI1JzL0tN8"
          curl -fsSL --retry 3 -o docs/screenshots/scope.png "$base/2QXI7u1fhW"
          curl -fsSL --retry 3 -o docs/screenshots/hardware.png "$base/S1NqLt0faG"
          curl -fsSL --retry 3 -o docs/screenshots/mobile.png "$base/7wGQZZwCoP"
          ls -l "$RUNNER_TEMP/opt.patch" docs/screenshots

      - name: 应用补丁
        run: git -c core.autocrlf=false apply -p2 --index "$RUNNER_TEMP/opt.patch"

      - name: 构建与测试
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python build.py
          test -s index.html
          test -s hardware.html
          ! grep -q '__STYLE__\|__VM__\|__APP__' index.html
          npm run lint
          npm test

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name 'syh-student'
          git config user.email '2137438918@qq.com'
          git add -A
          git commit -m '视觉改版：中性深色 + 主色体系、输出区可折叠、元件悬停浮层'
          set +e
          OUT=$(git push origin HEAD:main 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            MSG=$(echo "$OUT" | tr '\n' ' ' | tr -s ' ' | cut -c1-700)
            echo "::error title=PUSHFAIL::${MSG}"
            exit 1
          fi
