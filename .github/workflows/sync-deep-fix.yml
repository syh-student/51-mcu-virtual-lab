name: sync-deep-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bundle
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --max-time 90 -o /tmp/sync.bundle 'https://aka.doubaocdn.com/s/Ak3huefk6w'
          git fetch /tmp/sync.bundle
          git read-tree --reset -u FETCH_HEAD^{tree}
          git clean -fdx
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: 补全在程序化编辑后收起，Keil 导入支持多级目录'
          git push origin HEAD:main
